<div class="attachment"><a href="{% url 'asset' a.pk %}" target="_blank" rel="noopener">{% if a.purpose == 'requirements' %}要求{% else %}成果{% endif %}附件 · {{ a.name }}</a><small>{{ a.size|filesizeformat }}</small>{% if 'image/' in a.mime %}<img loading="lazy" src="{% url 'asset' a.pk %}" alt="{{ a.name }}">{% elif 'audio/' in a.mime %}<audio controls preload="none" src="{% url 'asset' a.pk %}"></audio>{% elif 'video/' in a.mime %}<video controls preload="metadata" src="{% url 'asset' a.pk %}"></video>{% elif a.mime == 'application/pdf' %}<details><summary>预览 PDF</summary><iframe title="{{ a.name }}" src="{% url 'asset' a.pk %}" loading="lazy"></iframe></details>{% endif %}</div>
