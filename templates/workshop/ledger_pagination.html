{% if ledger.paginator.num_pages > 1 %}<nav class="pagination" aria-label="流水分页">{% if ledger.has_previous %}<a href="?child={{ child.pk }}&page={{ request.GET.page|default:1 }}&ledger={{ ledger.previous_page_number }}">← 较新</a>{% endif %}<span>{{ ledger.number }} / {{ ledger.paginator.num_pages }}</span>{% if ledger.has_next %}<a href="?child={{ child.pk }}&page={{ request.GET.page|default:1 }}&ledger={{ ledger.next_page_number }}">更早 →</a>{% endif %}</nav>{% endif %}
