{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="分页">{% if page.has_previous %}<a href="?child={{ child.pk }}&view={{ request.GET.view }}&kind={{ request.GET.kind }}&phase={{ request.GET.phase }}&page={{ page.previous_page_number }}">← 上一页</a>{% endif %}<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页</span>{% if page.has_next %}<a href="?child={{ child.pk }}&view={{ request.GET.view }}&kind={{ request.GET.kind }}&phase={{ request.GET.phase }}&page={{ page.next_page_number }}">下一页 →</a>{% endif %}</nav>{% endif %}
